{% extends "base.html" %}

{% block title %}
Диалог с {{ username }}
{% endblock %}


{% block content %}

<div class="dialog">

    <div class="dialog-header">
        💬 {{ username }}
    </div>


    <div class="messages" id="messages">

        {% for sender, receiver, text, created_at in messages %}

        <div class="message 
        {% if sender == session['username'] %}
        mine
        {% else %}
        theirs
        {% endif %}
        ">

            <div class="sender">
                {{ sender }}
            </div>

            <div class="text">
                {{ text }}
            </div>

            <div class="time">
                {{ created_at }}
            </div>

        </div>

        {% endfor %}

    </div>


    <form class="send-form" 
    method="POST" 
    action="/send_private_message/{{ username }}">

        <input 
        type="hidden"
        name="receiver"
        value="{{ username }}">


        <input 
        name="message"
        placeholder="Написать сообщение..."
        autocomplete="off"
        required>


        <button>
            ➤
        </button>

    </form>

</div>


<style>

.dialog{
    height:100vh;
    display:flex;
    flex-direction:column;
}


.dialog-header{
    padding:20px;
    background:#111827;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #1e293b;
}


.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
}


.message{
    max-width:65%;
    padding:12px 16px;
    border-radius:18px;
    margin-bottom:12px;
}


.mine{
    background:#2563eb;
    margin-left:auto;
}


.theirs{
    background:#182338;
    margin-right:auto;
}


.sender{
    font-size:13px;
    opacity:.7;
}


.text{
    margin-top:5px;
    font-size:16px;
}


.time{
    margin-top:5px;
    font-size:11px;
    opacity:.6;
}


.send-form{
    display:flex;
    gap:10px;
    padding:15px;
    background:#111827;
}


.send-form input{
    flex:1;
    padding:15px 20px;
    border:none;
    border-radius:30px;
    background:#1e293b;
    color:white;
    outline:none;
}


.send-form button{
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:#2563eb;
    color:white;
    font-size:22px;
}


</style>

{% endblock %}
