<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse | Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>
<div class="background">

    <div class="blur blur-one"></div>

    <div class="blur blur-two"></div>

</div>

<div class="page">

    <div class="brand">

        <div class="logo">

            <img
                src="{{ url_for('static', filename='icons/pulse-logo.svg') }}"
                alt="Pulse">

        </div>

        <h1>Pulse</h1>

        <p>

            Создайте аккаунт и начните общение

        </p>

        <div class="features">
                <div class="feature">

        💬 Общайтесь без ограничений

    </div>

    <div class="feature">

        📞 Голосовые и видеозвонки

    </div>

    <div class="feature">

        🤖 Встроенный AI-помощник

    </div>

    <div class="feature">

        🔒 Сквозное шифрование

    </div>

    <div class="feature">

        ⚡ Быстрая синхронизация

    </div>

</div>

</div>

<div class="login-card">

    <h2>

        Создать аккаунт

    </h2>

    <p class="subtitle">

        Заполните данные для регистрации

    </p>

    <form method="POST">
        <div class="input-group">

    <label for="username">

        Имя пользователя

    </label>

    <input
        id="username"
        class="input"
        type="text"
        name="username"
        placeholder="Введите имя"
        autocomplete="username"
        required>

</div>

<div class="input-group">

    <label for="phone">

        Номер телефона

    </label>

    <input
        id="phone"
        class="input"
        type="tel"
        name="phone"
        placeholder="+41 79 123 45 67"
        autocomplete="tel"
        required>

</div>

<div class="input-group">

    <label for="password">

        Пароль

    </label>

    <div class="password-box">

        <input
            id="password"
            class="input"
            type="password"
            name="password"
            placeholder="Придумайте пароль"
            autocomplete="new-password"
            required>

        <button
            type="button"
            class="show-password"
            onclick="togglePassword()">

            👁

        </button>

    </div>

</div>
<div class="input-group">

    <label for="confirm_password">

        Подтвердите пароль

    </label>

    <div class="password-box">

        <input
            id="confirm_password"
            class="input"
            type="password"
            name="confirm_password"
            placeholder="Повторите пароль"
            autocomplete="new-password"
            required>

        <button
            type="button"
            class="show-password"
            onclick="toggleConfirmPassword()">

            👁

        </button>

    </div>

</div>

<div class="login-options">

    <label class="remember">

        <input
            type="checkbox"
            required>

        <span>

            Я принимаю условия использования

        </span>

    </label>

</div>

<button
    class="login-button"
    type="submit">

    Создать аккаунт →

</button>

<div class="register-link">

    Уже есть аккаунт?

    <a href="/login">

        Войти

    </a>

</div>

<div class="security-text">

    🔒 Ваш аккаунт будет защищён сквозным шифрованием

</div>

</form>

</div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
