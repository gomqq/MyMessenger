<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse | Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="background">

    <div class="blur blur-one"></div>

    <div class="blur blur-two"></div>

</div>

<div class="page">

    <div class="brand">

        <div class="logo">

    <img
        src="{{ url_for('static', filename='icons/pulse-logo.svg') }}"
        alt="Pulse">

</div>
        <h1>Pulse</h1>

        <p>

            Общение нового поколения

        </p>
        <div class="features">

    <div class="feature">

        💬 Современный мессенджер

    </div>

    <div class="feature">

        🤖 AI-помощник

    </div>

    <div class="feature">

        🔒 Сквозное шифрование

    </div>

    <div class="feature">

        ⚡ Мгновенные сообщения

    </div>

</div>

</div>

<div class="login-card">

    <h2>

        Добро пожаловать 👋

    </h2>

    <p class="subtitle">

        Войдите в свой аккаунт

    </p>

    <form method="POST">
        <div class="input-group">

    <label for="phone">

        Номер телефона

    </label>

    <input
        id="phone"
        class="input"
        type="tel"
        name="username"
        placeholder="+41 79 123 45 67"
        autocomplete="tel"
        required>

</div>
<div class="input-group">

    <label for="password">

        Пароль

    </label>

    <div class="password-box">

        <input
            id="password"
            class="input"
            type="password"
            name="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
            required>

        <button
            type="button"
            class="show-password"
            onclick="togglePassword()">

            👁

        </button>

    </div>

</div>
<div class="login-options">

    <label class="remember">

        <input
            type="checkbox"
            name="remember">

        <span>

            Запомнить меня

        </span>

    </label>

    <a href="#">

        Забыли пароль?

    </a>

</div>

<button
    class="login-button"
    type="submit">

    Войти →

</button>
<div class="divider">

    <span>или</span>

</div>

<div class="social-buttons">

    <button type="button" class="google-button">

        Google

    </button>

    <button type="button" class="apple-button">

        Apple

    </button>

</div>

<div class="register-link">

    Нет аккаунта?

    <a href="/register">

        Создать аккаунт

    </a>

</div>

<div class="security-text">

    🔒 Ваши данные защищены сквозным шифрованием

</div>

</form>

</div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
