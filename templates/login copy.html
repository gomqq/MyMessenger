<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse | Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="background">

    <div class="blur blur-1"></div>
    <div class="blur blur-2"></div>

</div>

<div class="login-wrapper">

    <div class="left-panel">

        <div class="logo">

            <div class="logo-icon">

                ⚡

            </div>

            <h1>Pulse</h1>

        </div>

        <h2>

            Общение нового поколения

        </h2>

        <p>

            Быстро.
            Красиво.
            Безопасно.

        </p>

        <div class="features">

            <div class="feature">

                💬 Современный мессенджер

            </div>

            <div class="feature">

                🤖 AI помощник

            </div>

            <div class="feature">

                🔒 Сквозное шифрование

            </div>

            <div class="feature">

                ⚡ Мгновенные сообщения

            </div>

        </div>

    </div>

    <div class="right-panel">

        <div class="login-card">

            <h2>

                Добро пожаловать 👋

            </h2>

            <p>

                Войдите в свой аккаунт

            </p>

            <form method="POST">
                <div class="input-group">

    <label>Номер телефона</label>

    <input
        type="text"
        name="username"
        class="input"
        placeholder="+41 79 123 45 67"
        required>

</div>

<div class="input-group">

    <label>Пароль</label>

    <div class="password-box">

        <input
            type="password"
            name="password"
            class="input"
            id="password"
            placeholder="Введите пароль"
            required>

        <button
            type="button"
            class="show-password"
            onclick="togglePassword()">

            👁

        </button>

    </div>

</div>

<div class="login-options">

    <label class="remember">

        <input
            type="checkbox">

        <span>

            Запомнить меня

        </span>

    </label>

    <a href="#">

        Забыли пароль?

    </a>

</div>

<button
class="login-button"
type="submit">

    Войти →

</button>

<div class="divider">

    <span>

        или

    </span>

</div>

<div class="social-buttons">

    <button
    type="button"
    class="google">

        Google

    </button>

    <button
    type="button"
    class="apple">

        Apple

    </button>

</div>

<div class="register-link">

    Нет аккаунта?

    <a href="/register">

        Создать аккаунт

    </a>

</div>
</form>

<div class="security-text">

    🔒 Ваши данные защищены сквозным шифрованием

</div>

</div>

</div>

</div>

<script>

function togglePassword(){

    const password = document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

}

</script>

</body>

</html>
